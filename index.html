<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipro — Weekly Instant Pot Planning</title>
<meta name="description" content="Plan a week of Instant Pot meals, track what your pantry is missing, and work through prep-ahead steps.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fefffd">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">

<script type="module" src="assets/js/main.js"></script>
</head>
<body>


<div class="wrap">
  <header class="app">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20"/><path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"/><path d="m4 8 16-4"/><path d="m8.86 6.78-.45-1.81a2 2 0 0 1 1.45-2.43l1.94-.48a2 2 0 0 1 2.43 1.46l.45 1.8"/></svg>
      </div>
      <div>
        <h1>Recipro</h1>
        <p>Weekly Instant Pot planning &mdash; pantry, recipes, prep</p>
      </div>
    </div>
    <div class="week-label-wrap">
      <label for="weekSelect">Week</label>
      <span class="pselect week-picker">
        <select id="weekSelect"></select>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </span>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab-btn active" data-tab="week" role="tab" aria-selected="true" tabindex="0">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
      This week
    </button>
    <button class="tab-btn" data-tab="recipes" role="tab" aria-selected="false" tabindex="-1">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
      Recipes
    </button>
    <button class="tab-btn" data-tab="pantry" role="tab" aria-selected="false" tabindex="-1">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>
      Pantry
    </button>
  </nav>

  <section id="panel-week" class="panel" role="tabpanel">
    <div class="section-head"><h2>This week&rsquo;s meals</h2></div>
    <div id="dayGrid" class="day-grid"></div>

    <div class="section-head"><h2>Shopping list</h2><span id="shopCount" class="count"></span></div>
    <div id="shopArea"></div>

    <div class="section-head"><h2>Prep ahead</h2></div>
    <div id="prepArea"></div>
  </section>

  <section id="panel-recipes" class="panel" role="tabpanel" hidden>
    <div class="section-head">
      <h2>Recipes</h2>
      <button class="btn primary small" id="newRecipeBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        New recipe
      </button>
    </div>
    <div id="recipeGrid" class="recipe-grid"></div>
  </section>

  <section id="panel-pantry" class="panel" role="tabpanel" hidden>
    <div class="section-head"><h2>Ingredients</h2></div>
    <div id="ingredientList" class="pantry-list"></div>
    <form class="add-row" id="addIngredientForm">
      <input type="text" placeholder="Add an ingredient&hellip;" id="newIngredientInput" aria-label="New ingredient name" />
      <button class="btn" type="submit">Add ingredient</button>
    </form>

    <div class="section-head"><h2>Household &amp; misc</h2></div>
    <div id="miscList" class="pantry-list"></div>
    <form class="add-row" id="addMiscForm">
      <input type="text" placeholder="Add a household item&hellip;" id="newMiscInput" aria-label="New household item name" />
      <button class="btn" type="submit">Add item</button>
    </form>
  </section>
</div>

<dialog id="recipeDialog">
  <div class="dialog-inner">
    <div class="dialog-head">
      <h2 id="recipeDialogTitle">New recipe</h2>
      <button type="button" class="icon-btn" id="closeDialogBtn" aria-label="Close">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <form id="recipeForm">
      <div class="field">
        <label for="rName">Name</label>
        <input type="text" id="rName" required />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="rTime">Instant Pot time (min)</label>
          <input type="number" id="rTime" min="1" required />
        </div>
        <div class="field">
          <label for="rServings">Servings</label>
          <input type="number" id="rServings" min="1" required />
        </div>
      </div>
      <div class="field">
        <label for="rTags">Tags (comma separated)</label>
        <input type="text" id="rTags" placeholder="dal, vegan, weeknight" />
      </div>

      <div class="field">
        <label>Ingredients</label>
        <div id="ingredientRows"></div>
        <button type="button" class="btn small" id="addIngRowBtn">+ Add ingredient</button>
      </div>

      <div class="field">
        <label>Prep ahead steps</label>
        <div id="prepRows"></div>
        <button type="button" class="btn small" id="addPrepRowBtn">+ Add prep step</button>
      </div>

      <div class="field">
        <label for="rInstructions">Instructions</label>
        <textarea id="rInstructions" required></textarea>
      </div>

      <div class="dialog-actions">
        <button type="button" class="btn danger-text" id="deleteRecipeBtn" style="display:none;">Delete recipe</button>
        <div class="right">
          <button type="button" class="btn outline" id="cancelRecipeBtn">Cancel</button>
          <button type="submit" class="btn primary">Save recipe</button>
        </div>
      </div>
    </form>
  </div>
</dialog>


</body>
</html>
